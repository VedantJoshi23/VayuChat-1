import org.gradle.api.artifacts.DependencyResolveDetails

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // Must match the Kotlin version used by @react-native/gradle-plugin (see its libs.versions.toml)
        kotlinVersion = "2.1.20"
        // 16.1.0 is required for AGP 8.9–8.13 support (16.0.0 does not support AGP 8.12.0)
        chaquopyVersion = "16.1.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Kotlin plugin — version must match @react-native/gradle-plugin (kotlinVersion = "2.1.20")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.chaquo.python:gradle:${chaquopyVersion}")
    }
}

apply plugin: "com.facebook.react.rootproject"

/**
 * FIX: Some third-party native libraries (e.g. @nozbe/watermelondb) still use
 * the wildcard 'com.facebook.react:react-native:+' dependency.
 * This resolution rule pins it to the real managed artifact so Gradle doesn't
 * hit Maven for an undefined version, which triggers both a download failure and
 * a "Deprecated Gradle features" warning.
 */
allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'com.facebook.react' &&
                details.requested.name == 'react-native') {
                details.useTarget('com.facebook.react:react-android:+')
                details.because('react-native artifact was renamed to react-android in RN 0.71+')
            }
        }
    }
    repositories {
        google()
    }
}

// NOTE: namespace is patched directly in react-native-fs/android/build.gradle via patch-package.
// A subprojects/afterEvaluate hook would throw "already evaluated" with Gradle 8.13 + composite builds.
